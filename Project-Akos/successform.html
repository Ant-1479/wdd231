<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Message Sent — Akos Fragrance</title>
  <meta name="description" content="Your message has been received by Akos Fragrance." />
  <meta name="author" content="Akos Fragrance" />
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <nav class="site-nav scrolled" aria-label="Main navigation">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">AK<span>O</span>S</a>
      <ul class="nav-links" role="list">
        <li><a href="index.html">Home</a></li>
        <li><a href="collection.html">Collection</a></li>
        <li><a href="about.html">Our Story</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
      <button class="hamburger" aria-label="Toggle navigation menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <nav class="nav-mobile" aria-label="Mobile navigation">
    <a href="index.html">Home</a>
    <a href="collection.html">Collection</a>
    <a href="about.html">Our Story</a>
    <a href="contact.html">Contact</a>
  </nav>

  <main>
    <div class="form-action-page">
      <div class="form-action-card" role="main" aria-labelledby="success-heading">
        <div class="success-icon" aria-hidden="true">✓</div>
        <h1 id="success-heading">Message received.</h1>
        <p>Thank you for reaching out. We read every message personally and will reply within 24 hours.</p>

        <!-- Display submitted form data -->
        <div class="submitted-data" aria-label="Submitted form details" id="submitted-data">
          <!-- Populated by JS -->
        </div>

        <div style="display:flex; gap:16px; justify-content:center; flex-wrap:wrap;">
          <a href="index.html" class="btn btn-primary">Back to Home</a>
          <a href="collection.html" class="btn btn-outline" style="color:var(--ivory); border-color:rgba(245,239,230,0.3);">Explore Collection</a>
        </div>

        <p style="margin-top:28px; font-size:12px; color:rgba(245,239,230,0.25);">
          <a href="https://www.youtube.com" target="_blank" rel="noopener noreferrer" style="color:rgba(245,239,230,0.3);">▶ Video Demo</a>
        </p>
      </div>
    </div>
  </main>

  <script type="module">
    import { initNav } from './js/nav.js';
    initNav();

    // Display submitted form data from URL query params
    const params = new URLSearchParams(window.location.search);
    const container = document.getElementById('submitted-data');

    const fields = [
      { key: 'firstname', label: 'First Name' },
      { key: 'lastname', label: 'Last Name' },
      { key: 'email', label: 'Email' },
      { key: 'subject', label: 'Subject' },
      { key: 'preference', label: 'Preference' },
      { key: 'message', label: 'Message' },
    ];

    const rows = fields
      .filter(f => params.get(f.key))
      .map(f => `
        <div class="data-row">
          <label>${f.label}</label>
          <span>${params.get(f.key)}</span>
        </div>
      `).join('');

    container.innerHTML = rows || '<p style="color:rgba(245,239,230,0.3); font-size:13px;">No form data to display.</p>';
  </script>
</body>
</html>
