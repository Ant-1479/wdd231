<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop | Akos Luxe</title>
  <meta name="description" content="Search and filter Akos Luxe bags, shoes and slippers. See prices in Ghanaian cedis with an optional US dollar equivalent.">
  <meta name="theme-color" content="#0d0d0d">
  <meta property="og:title" content="Shop | Akos Luxe">
  <meta property="og:description" content="Search and filter Akos Luxe bags, shoes and slippers. See prices in Ghanaian cedis with an optional US dollar equivalent.">
  <meta property="og:type" content="website">
  <link rel="icon" href="images/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;1,6..96,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/small.css">
  <link rel="stylesheet" href="css/large.css" media="(min-width: 768px)">
  <script src="js/nav.js" defer></script>
  <script src="data/products.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body data-page="shop">
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="site-header" id="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">
        <img src="images/icon.svg" alt="" width="36" height="36">
        <span>Akos Luxe</span>
      </a>
      <nav id="primary-nav" class="primary-nav" aria-label="Main">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="shop.html" aria-current="page">Shop</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
      <div class="header-tools">
        <button class="icon-btn cart-btn" type="button" id="cart-button" aria-controls="cart-drawer" aria-label="Open cart, empty">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><path d="M6 8h12l1.2 12H4.8L6 8Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span class="cart-count" id="cart-count" aria-hidden="true">0</span>
        </button>
        <button class="icon-btn nav-toggle" type="button" id="nav-toggle" aria-expanded="false" aria-controls="primary-nav" aria-label="Open menu">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
  </header>
  <noscript><p class="notice notice--error">Akos Luxe needs JavaScript to show products and the cart. Please turn it on and reload.</p></noscript>

  <main id="main">
    <section class="page-head">
      <div class="container">
        <h1>Our collection</h1>
        <p>Search by name, colour or style, or pick a category.</p>
      </div>
    </section>
    <section class="section section--tight" aria-label="Products">
      <div class="container">
        <form class="search" id="search-form" role="search">
          <label for="search-input">Search products</label>
          <div class="search__row">
            <input id="search-input" name="q" type="search" placeholder="Try “black bag” or “slippers”" autocomplete="off">
            <button class="btn btn--dark" type="submit">Search</button>
          </div>
        </form>
        <div class="filters" id="category-filters" role="group" aria-label="Filter by category"></div>
        <div class="results-bar">
          <p id="result-count" class="result-count" aria-live="polite"></p>
          <button class="link-btn" type="button" id="reset-filters" hidden>Clear search and filters</button>
        </div>
        <div id="notices" class="notices"></div>
        <div class="product-grid" id="product-grid">
          <p class="loading" data-loading>Loading products…</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
</body>
</html>
